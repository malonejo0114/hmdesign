<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운명코드 | Human Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="app-shell" id="appShell">
        <header class="app-header">
          <h1>Jo Hanjin</h1>
          <p id="headlineMeta">제너레이터 • 3 / 6 • 천골 권위</p>
        </header>

        <div class="skin-toggle">
          <button class="skin-btn active" data-skin="free">🆓 무료</button>
          <button class="skin-btn" data-skin="paid">💎 유료</button>
        </div>

        <section class="chart-wrap">
          <svg id="bodygraph" viewBox="0 0 300 490" aria-label="휴먼디자인 바디그래프"></svg>
          <div class="legend">
            <span class="design">● 무의식</span>
            <span class="personality">● 의식</span>
            <span class="both">● 둘 다</span>
          </div>
        </section>

        <section class="detail" id="detailPanel">게이트 또는 센터를 누르면 상세 설명이 표시됩니다.</section>

        <section id="tabContent" class="tab-content"></section>

        <nav class="bottom-tabs">
          <button class="tab-btn active" data-tab="chart">📊 차트</button>
          <button class="tab-btn" data-tab="info">📋 정보</button>
          <button class="tab-btn" data-tab="gates">🔢 게이트</button>
          <button class="tab-btn" data-tab="centers">🔷 센터</button>
        </nav>
      </section>

      <section class="plan-box">
        <h2>개발 계획 반영 상태</h2>
        <ul>
          <li>MVP/Production/Enterprise 단계 요약 반영</li>
          <li>Range 모드 안내 문구 반영</li>
          <li>차트 SVG/탭/스킨 토글 반영</li>
          <li>게이트/센터 클릭 상세 반영</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
